name: Garder le serveur eveille (heures de classe)

# Lundi au vendredi, 7 h a 17 h heure de l'Est (UTC-4 ete / UTC-5 hiver -> 11h-22h UTC couvre les deux).
# ~11 h/jour x 22 jours = ~240 h/mois, bien sous la limite gratuite de 750 h de Render.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 11-21 * * 1-5"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 60 "${{ secrets.API_URL }}/api/" || true
